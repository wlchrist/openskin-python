name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install .
      - name: Test client configuration
        run: |
          python - <<'PY'
          from openskin_client.openskin import PRODUCTION_BASE_URL, client
          api = client('sdk-test-key')
          assert api.configuration.host == PRODUCTION_BASE_URL
          assert api.configuration.api_key['PlatformAPIKey'] == 'sdk-test-key'
          PY
      - run: python -m build
